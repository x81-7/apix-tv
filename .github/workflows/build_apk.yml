name: Build Android App

on:
  push:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        working-directory: ./android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ci-release.keystore

      - name: Build Release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          EXTERNAL_PANEL_DECRYPTION_KEY: ${{ secrets.EXTERNAL_PANEL_DECRYPTION_KEY }}
          ENCRYPTION_SECRET_KEY: ${{ secrets.ENCRYPTION_SECRET_KEY }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_ANON_KEY: ${{ secrets.CLOUD_ANON_KEY }}
        working-directory: ./android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace --console=plain \
            -Pandroid.injected.signing.store.file=$(pwd)/app/ci-release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 | tee build.log
          echo "=== RELEASE BUILD COMPLETED (APK + AAB) ==="

      - name: Build Debug APK (fallback)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          EXTERNAL_PANEL_DECRYPTION_KEY: ${{ secrets.EXTERNAL_PANEL_DECRYPTION_KEY }}
          ENCRYPTION_SECRET_KEY: ${{ secrets.ENCRYPTION_SECRET_KEY }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_ANON_KEY: ${{ secrets.CLOUD_ANON_KEY }}
        working-directory: ./android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          echo "=== BUILD COMPLETED ==="

      - name: Show errors on failure
        if: failure()
        working-directory: ./android
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -i "error:" build.log | head -50 || true
          echo "=== LAST 80 LINES ==="
          tail -80 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: APiX-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB (Play Store bundle)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: APiX-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: APiX-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload iOS workflow hint
        if: always()
        run: echo "Use ios-build workflow for unsigned IPA artifacts"

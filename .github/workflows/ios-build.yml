name: Build iOS IPA

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Inject Secure Keys into Source Code
        working-directory: ios
        env:
          EXTERNAL_KEY: ${{ secrets.EXTERNAL_PANEL_DECRYPTION_KEY }}
          INTERNAL_KEY: ${{ secrets.ENCRYPTION_SECRET_KEY }}
        run: |
          echo "Injecting encryption secrets directly into Swift source code..."
          mkdir -p APiXTV/Services
          SECRETS_FILE="APiXTV/Services/AppSecrets.swift"
          
          cat <<EOF > $SECRETS_FILE
          import Foundation

          enum AppSecrets {
              static let externalKey = "$EXTERNAL_KEY"
              static let internalKey = "$INTERNAL_KEY"
          }
          EOF
          echo "Secrets successfully embedded into AppSecrets.swift"

      - name: Inject Cloud settings into Info.plist
        working-directory: ios
        env:
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_ANON_KEY: ${{ secrets.CLOUD_ANON_KEY }}
          # White-label gateway: route ALL iOS traffic through the Cloudflare
          # Worker (hides Supabase). CloudConfig prefers APIX_WORKER_URL.
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          PLIST="APiXTV/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "Info.plist not found at $PLIST"; exit 1;
          fi
          set_or_add() {
            local key="$1"; local val="$2"
            if [ -z "$val" ]; then echo "Skipping $key (empty)"; return; fi
            /usr/libexec/PlistBuddy -c "Set :$key $val" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$key string $val" "$PLIST"
            echo "Injected $key"
          }
          set_or_add APIX_CLOUD_URL "$CLOUD_URL"
          set_or_add APIX_CLOUD_ANON_KEY "$CLOUD_ANON_KEY"
          # Worker origin takes priority when present.
          set_or_add APIX_WORKER_URL "$WORKER_URL"

      - name: Build app without signing
        working-directory: ios
        run: |
          xcodebuild \
            -project APiXTV.xcodeproj \
            -scheme APiXTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/APiXTV.app
          mkdir -p artifacts
          /usr/bin/zip -qry artifacts/APiXTV-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: APiXTV-unsigned-ipa
          path: ios/artifacts/APiXTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Simulator build (.app) — drop into Appetize.io / BrowserStack / iOS
      # simulator. Faster than IPA, no signing or device required.
      # ---------------------------------------------------------------------
      - name: Build Simulator .app
        working-directory: ios
        run: |
          xcodebuild \
            -project APiXTV.xcodeproj \
            -scheme APiXTV \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Simulator app as ZIP
        working-directory: ios
        run: |
          APP_PATH=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p artifacts
          cd "$(dirname "$APP_PATH")"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/ios/artifacts/APiXTV-simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: APiXTV-simulator-app
          path: ios/artifacts/APiXTV-simulator.zip
          if-no-files-found: error
          retention-days: 30

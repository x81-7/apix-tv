<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    /* المشغل المخفي: لا أزرار، لا واجهة، فقط شاشة الفيديو */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    .stage { position: fixed; inset: 0; }
    video {
      width: 100%; height: 100%; object-fit: contain; background: #000;
      pointer-events: none; outline: none;
    }
    #audio2 { display: none; }
    #logo {
      position: absolute; pointer-events: none;
      max-width: 50%; max-height: 50%;
      display: none;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-panel { display: none !important; -webkit-appearance: none !important; opacity: 0 !important; }
    #cover {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      transition: opacity .25s ease;
    }
    #cover.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="cover"></div>
  <div class="stage">
    <video id="video" playsinline autoplay muted preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback noplaybackrate"></video>
    <video id="audio2" playsinline preload="auto"></video>
    <img id="logo" />
  </div>

  <script>
    const video = document.getElementById('video');
    const audio2 = document.getElementById('audio2');
    const logo = document.getElementById('logo');
    let player = null;
    let lockAspect = false;

    // دالة تحويل Hex إلى Base64Url (مطلوبة إجبارياً في Dash.js)
    function hexToBase64Url(hex) {
        let str = '';
        for (let i = 0; i < hex.length; i += 2) {
            str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        }
        return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    // إرسال حالة التشغيل إلى تطبيق الأندرويد (Kotlin)
    function sendState() {
        if(window.AndroidHybrid) {
            let buffering = video.readyState < 3;
            window.AndroidHybrid.updateState(video.currentTime || 0, video.duration || 0, video.paused, buffering);
        }
    }

    // استخراج الجودات والصوتيات وإرسالها للأندرويد
    function sendTracks() {
        if(!player || !window.AndroidHybrid) return;
        try {
            let bitrates = player.getBitrateInfoListFor("video") || [];
            let heights = [...new Set(bitrates.map(b => b.height).filter(h => h))].sort((a,b) => b - a);
            
            let audioTracks = player.getTracksFor("audio") || [];
            let audios = audioTracks.map(a => a.lang || a.id || 'unknown');
            
            window.AndroidHybrid.updateTracks(heights.join(','), audios.join(','));
        } catch(e) {}
    }

    function applyAspect(mode) {
      const m = String(mode || '').toLowerCase();
      if (m === 'fill' || m === 'stretch') { video.style.objectFit = 'fill'; }
      else if (m === 'zoom' || m === 'cover' || m === 'crop') { video.style.objectFit = 'cover'; }
      else if (m === '16:9') { video.style.objectFit = 'contain'; video.style.aspectRatio = '16/9'; }
      else if (m === '4:3')  { video.style.objectFit = 'contain'; video.style.aspectRatio = '4/3'; }
      else { video.style.objectFit = 'contain'; video.style.aspectRatio = ''; }
    }

    function applyLogo(cfg) {
      if (!cfg || !cfg.url) return;
      logo.src = cfg.url;
      logo.style.opacity = (typeof cfg.opacity === 'number' && cfg.opacity > 0) ? cfg.opacity : 1;
      const wPct = cfg.width || 12;
      const xPct = Math.max(0, Math.min(100, cfg.offsetX || 0));
      const yPct = Math.max(0, Math.min(100, cfg.offsetY || 0));
      logo.style.width = wPct + '%';
      logo.style.height = 'auto';
      logo.style.left = logo.style.right = logo.style.top = logo.style.bottom = 'auto';
      switch ((cfg.position || '').toLowerCase()) {
        case 'top-left':     logo.style.left = xPct + '%'; logo.style.top = yPct + '%'; break;
        case 'top-right':    logo.style.right = xPct + '%'; logo.style.top = yPct + '%'; break;
        case 'bottom-left':  logo.style.left = xPct + '%'; logo.style.bottom = yPct + '%'; break;
        case 'bottom-right': logo.style.right = xPct + '%'; logo.style.bottom = yPct + '%'; break;
        default:             logo.style.left = xPct + '%'; logo.style.top = yPct + '%';
      }
      logo.onload = () => { logo.style.display = 'block'; };
    }

    function startExternalAudio(url) {
      if (!url) return;
      video.muted = true;
      audio2.src = url;
      audio2.muted = false;
      audio2.volume = 1.0;
      audio2.play().catch(()=>{});
      video.addEventListener('play', () => audio2.play().catch(()=>{}));
      video.addEventListener('pause', () => audio2.pause());
      setInterval(() => {
        if (!audio2.paused && Math.abs((audio2.currentTime||0) - (video.currentTime||0)) > 1.5) {
          try { audio2.currentTime = video.currentTime; } catch(e){}
        }
      }, 2000);
    }

    // 🔴 الجسر السري الذي يحقن منه الأندرويد البيانات بأمان
    window.initializePlayer = function(jsonPayload) {
        try {
            const cfg = JSON.parse(jsonPayload);
            const url = cfg.url;
            const ck = cfg.ck;
            lockAspect = cfg.lock === 1;

            applyAspect(cfg.aspect);
            if (cfg.logo) applyLogo({ url: cfg.logo, position: cfg.logoPos, offsetX: cfg.logoX, offsetY: cfg.logoY, width: cfg.logoW, opacity: cfg.logoOpa });

            if (typeof dashjs === 'undefined') {
                if(window.AndroidHybrid) window.AndroidHybrid.error('فشل تحميل مكتبة dash.js');
                return;
            }

            player = dashjs.MediaPlayer().create();
            
            if (ck && ck.includes(':')) {
                const parts = ck.split(':');
                const kidHex = parts[0].replace(/[^a-fA-F0-9]/g, '');
                const keyHex = parts[1].replace(/[^a-fA-F0-9]/g, '');
                
                if (kidHex && keyHex) {
                    let clearKeys = {};
                    clearKeys[hexToBase64Url(kidHex)] = hexToBase64Url(keyHex);
                    
                    if (kidHex.length === 32) {
                        let rKid = kidHex.substring(6,8) + kidHex.substring(4,6) + kidHex.substring(2,4) + kidHex.substring(0,2) + 
                                   kidHex.substring(10,12) + kidHex.substring(8,10) + kidHex.substring(14,16) + kidHex.substring(12,14) + kidHex.substring(16);
                        clearKeys[hexToBase64Url(rKid)] = hexToBase64Url(keyHex);
                    }
                    
                    player.setProtectionData({ 'org.w3.clearkey': { clearkeys: clearKeys } });
                }
            }

            player.updateSettings({
                debug: { logLevel: 0 },
                streaming: {
                    retryAttempts: { MPD: 5, MediaSegment: 5, InitializationSegment: 5 },
                    retryIntervals: { MPD: 1000, MediaSegment: 1000 },
                    lowLatencyEnabled: false,
                    abr: { autoSwitchBitrate: { video: true } }
                }
            });

            player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                const code = e.error && (e.error.code || e.error);
                if (code === 'manifestError' || code === 27 || code === 'mediaError') {
                    if(window.AndroidHybrid) window.AndroidHybrid.error('فشل تحميل البث MPD');
                }
            });

            video.addEventListener('playing', () => {
                const c = document.getElementById('cover');
                if (c) c.classList.add('hidden');
            }, { once: true });

            try {
                player.initialize(video, url, true);
                if (!cfg.audio2) { video.muted = false; }
                if (cfg.audio2) startExternalAudio(cfg.audio2);
            } catch(e) {
                if(window.AndroidHybrid) window.AndroidHybrid.error('فشل بدء المشغل: ' + (e.message || e));
                return;
            }
            
            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, sendTracks);
            player.on(dashjs.MediaPlayer.events.PLAYBACK_PLAYING, sendTracks);
            
            setInterval(sendState, 500);

        } catch(e) {
            if(window.AndroidHybrid) window.AndroidHybrid.error("فشل استقبال البيانات المحقونة.");
        }
    };

    // ==========================================
    // الأوامر التي يستقبلها الويب من أزرار الكوتلن
    // ==========================================
    window.playVid = () => video.play();
    window.pauseVid = () => video.pause();
    window.seekVid = (sec) => { video.currentTime += sec; sendState(); };
    window.seekTo = (sec) => { video.currentTime = sec; sendState(); };
    
    window.setFit = (mode) => {
        if (lockAspect) return;
        const modes = ['contain', 'fill', 'cover'];
        video.style.objectFit = modes[mode] || 'contain';
    };
    window.isAspectLocked = () => lockAspect;

    window.setQ = (h) => {
        if(h == -1) {
            player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } });
        } else {
            player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } });
            let bitrates = player.getBitrateInfoListFor("video");
            let match = bitrates.find(b => b.height == h);
            if(match) player.setQualityFor("video", match.qualityIndex);
        }
    };

    window.setA = (lang) => {
        let audioTracks = player.getTracksFor("audio");
        let match = audioTracks.find(a => (a.lang || a.id || 'unknown') === lang);
        if(match) player.setCurrentTrack(match);
    };

  </script>
</body>
</html>
